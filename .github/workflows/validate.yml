name: Validate listings
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/clamav
      # Every listing at its pinned commit: files, hashes, package format, signer, virus scan.
      - run: npm run ci
        env:
          CLAMAV_DB: .clamav
