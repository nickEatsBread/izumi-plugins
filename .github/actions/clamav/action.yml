name: ClamAV
description: Installs ClamAV with current virus definitions, copied to .clamav (set CLAMAV_DB=.clamav for the scan).
runs:
  using: composite
  steps:
    - id: day
      shell: bash
      run: |
        sudo apt-get -qq update && sudo apt-get -qq install -y clamav >/dev/null
        # The package starts its own updater; it holds the database lock and races this one.
        sudo systemctl stop clamav-freshclam || true
        echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
    # One saved copy a day (about 250 MB); freshclam fetches only the day's changes on top of it.
    - uses: actions/cache@v4
      with:
        path: .clamav
        key: clamav-${{ steps.day.outputs.day }}
        restore-keys: clamav-
    - shell: bash
      run: |
        mkdir -p .clamav
        if ls .clamav/*.c?d >/dev/null 2>&1; then
          sudo cp .clamav/*.c?d /var/lib/clamav/
          sudo chown clamav:clamav /var/lib/clamav/*.c?d
        fi
        # Never scan without definitions: a failed refresh is only fine when the cache had some.
        sudo freshclam --quiet || ls /var/lib/clamav/main.c?d >/dev/null
        cp /var/lib/clamav/*.c?d .clamav/
